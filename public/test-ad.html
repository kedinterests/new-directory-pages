<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRF Ad Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a192f;
      margin: 0;
      padding: 0;
      width: 300px;
      height: 250px;
      overflow: hidden;
      font-family: 'Lato', sans-serif;
    }

    .ad {
      width: 300px;
      height: 250px;
      background: linear-gradient(155deg, #0a192f 0%, #0e2040 60%, #0a1628 100%);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 20px 22px 18px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
    }

    /* Subtle diagonal texture lines */
    .ad::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 18px,
        rgba(197,160,89,0.04) 18px,
        rgba(197,160,89,0.04) 19px
      );
      pointer-events: none;
    }

    /* Gold top border accent */
    .ad::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #c5a059 30%, #e2c47a 60%, transparent);
    }

    .sponsored {
      font-family: 'Lato', sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(197,160,89,0.6);
      margin-bottom: 14px;
    }

    .eyebrow {
      font-family: 'Lato', sans-serif;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #c5a059;
      margin-bottom: 8px;
    }

    .headline {
      font-family: 'Playfair Display', serif;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.22;
      color: #f8f6f1;
      margin-bottom: 10px;
      position: relative;
    }

    .divider {
      width: 28px;
      height: 1.5px;
      background: #c5a059;
      margin-bottom: 11px;
      opacity: 0.8;
    }

    .body {
      font-size: 11.5px;
      line-height: 1.55;
      color: rgba(248,246,241,0.68);
      flex: 1;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 8px 16px;
      background: #c5a059;
      color: #0a192f;
      font-family: 'Lato', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 3px;
      text-decoration: none;
      width: fit-content;
    }

    .cta svg {
      flex-shrink: 0;
    }

    /* Corner seal */
    .seal {
      position: absolute;
      bottom: 16px;
      right: 18px;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(197,160,89,0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .seal-text {
      font-family: 'Playfair Display', serif;
      font-size: 11px;
      font-weight: 700;
      color: rgba(197,160,89,0.5);
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="ad">
    <div class="sponsored">Sponsored</div>
    <div class="eyebrow">Mineral Rights Forum</div>
    <div class="headline">Reach Mineral&nbsp;Rights Owners Nationwide</div>
    <div class="divider"></div>
    <div class="body">Get listed in the trusted directory used by thousands of mineral owners.</div>
    <a class="cta" href="#">
      Get Listed
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M2 5h6M5.5 2.5L8 5l-2.5 2.5" stroke="#0a192f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div class="seal"><span class="seal-text">MRF</span></div>
  </div>
</body>
</html>
